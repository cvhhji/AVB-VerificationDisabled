name: Build ABL AVB Patcher
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore: ['**.md']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build patch_abl_avb
        run: |
          make
          mkdir -p out
          cp -f abl_patcher/patch_abl_avb out/patch_abl_avb
      - name: Run unit tests
        run: |
          cc -O2 -Wall -Wextra -std=c11 -Iabl_patcher \
            tests/test_arm64_util.c abl_patcher/arm64_util.c \
            -o /tmp/test_arm64_util
          /tmp/test_arm64_util
          bash tests/test_abl_patch.sh abl_patcher/patch_abl_avb tests/samples
          bash tests/test_efisp_layout.sh
      - name: Install extractfv deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends liblzma-dev curl
      - name: Multi-ABL patch test
        run: |
          set +e
          bash tests/test_multi_abl.sh abl_patcher/patch_abl_avb | tee /tmp/multi-abl.log
          rc=${PIPESTATUS[0]}
          {
            echo '## Multi-ABL diagnostics'
            echo '```text'
            cat /tmp/multi-abl.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          diagnostic=$(grep -E '^  |^\[3/3\] Results:' /tmp/multi-abl.log | tr '\n' ';' | sed 's/;$//')
          echo "::error title=Multi-ABL candidate summary::$diagnostic"
          exit "$rc"
      - uses: actions/upload-artifact@v4
        with:
          name: patch_abl_avb
          path: out/patch_abl_avb
          if-no-files-found: error

  toolkit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-compile toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            mingw-w64 \
            liblzma-dev \
            zip \
            curl
      - name: Download xz source (with retries)
        run: |
          mkdir -p /tmp/xz-src
          for i in 1 2 3 4 5; do
            echo "Download attempt $i..."
            if curl -sL --connect-timeout 30 --max-time 120 \
              "https://tukaani.org/xz/xz-5.4.5.tar.gz" \
              -o /tmp/xz-src/xz.tar.gz; then
              tar -xzf /tmp/xz-src/xz.tar.gz -C /tmp/xz-src --strip-components=1
              if [ -f /tmp/xz-src/configure ]; then
                echo "xz source ready at /tmp/xz-src"
                exit 0
              fi
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "ERROR: Failed to download xz source after 5 attempts"
          exit 1
      - name: Build Linux toolkit
        run: make -C targets/toolkit_linux
      - name: Build Android toolkit
        run: XZ_SRC=/tmp/xz-src make -C targets/toolkit_android
      - name: Build Windows toolkit
        run: XZ_SRC=/tmp/xz-src make -C targets/toolkit_windows
      - name: Generate device-specific safe EFISP loaders
        run: |
          set -euo pipefail
          GBL_RAW=https://raw.githubusercontent.com/cvhhji/gbl_root_canoe/main
          DEVICES="CPH2841 OPD2513 PLK110 PLR110 PLZ110 PMA120 myron nezha nezha_global pandora popsicle pudding"
          mkdir -p out/safe_efisp
          for device in $DEVICES; do
            work="/tmp/safe-$device"
            mkdir -p "$work/extracted" "out/safe_efisp/$device/efisp"
            curl -fsSL "$GBL_RAW/ablrepo/$device/abl.img" -o "$work/abl.img"
            targets/toolkit_linux/build/toolkit/bin/extractfv -o "$work/extracted" "$work/abl.img"
            test -s "$work/extracted/LinuxLoader.efi"
            targets/toolkit_linux/build/toolkit/bin/patch_abl \
              "$work/extracted/LinuxLoader.efi" \
              "out/safe_efisp/$device/efisp/boot.efi"
            test -s "out/safe_efisp/$device/efisp/boot.efi"
            cp targets/toolkit_linux/resources/efisp/BOOTENTRIES \
              "out/safe_efisp/$device/efisp/BOOTENTRIES"
            sha256sum "out/safe_efisp/$device/efisp/boot.efi" \
              > "out/safe_efisp/$device/efisp/boot.efi.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: toolkit_linux
          path: targets/toolkit_linux/build/toolkit/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: toolkit_android
          path: targets/toolkit_android/build/toolkit/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: toolkit_windows
          path: targets/toolkit_windows/build/toolkit/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: safe_efisp_loaders
          path: out/safe_efisp/
          if-no-files-found: error
