name: Build ABL AVB Patcher
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build patch_abl_avb
        run: |
          make
          mkdir -p out
          cp -f abl_patcher/patch_abl_avb out/patch_abl_avb
      - name: Run tests
        run: bash tests/test_abl_patch.sh abl_patcher/patch_abl_avb tests/samples
      - uses: actions/upload-artifact@v4
        with:
          name: patch_abl_avb
          path: out/patch_abl_avb
          if-no-files-found: error
